apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostwire-proxy
  labels:
    app: ghostwire-proxy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ghostwire-proxy
  template:
    metadata:
      labels:
        app: ghostwire-proxy
    spec:
      containers:
      - name: ghostwire-proxy
        # Replace <YOUR_DOCKER_HUB_USERNAME> before applying
        image: pdk45/ghostwire-proxy:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ghostwire-proxy
spec:
  type: NodePort
  selector:
    app: ghostwire-proxy
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    # Optional: explicitly map to a specific node port if needed
    # nodePort: 30080
